<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ubah Order Status</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
    <style>
      .table-responsive {
        max-height: 600px;
        overflow-y: auto;
      }
      .loading-overlay {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(255, 255, 255, 0.8);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
      }
      .table-container {
        position: relative;
      }
    </style>
  </head>
  <body class="p-4">
    <div class="container">
      <div class="d-flex align-items-center justify-content-between mb-4">
        <h4 class="mb-0">Ubah Order Status</h4>
        <div class="d-flex gap-2">
          <a href="/" class="btn btn-outline-secondary" title="Home">🏠</a>
          <a href="/logout" class="btn btn-outline-danger" title="Logout">⎋</a>
        </div>
      </div>

      <!-- Search Form -->
      <div class="card mb-3">
        <div class="card-body">
          <form id="frmSearch" class="row g-3 align-items-end">
            <div class="col-md-3">
              <label class="form-label">Environment <span class="text-danger">*</span></label>
              <select id="selectEnv" class="form-select" required>
                <option value="">-- Pilih Environment --</option>
                <option value="preprod">Preprod</option>
                <option value="prod">Production</option>
              </select>
            </div>
            <div class="col-md-7">
              <label class="form-label">Order Number <span class="text-danger">*</span></label>
              <input id="orderNumber" type="text" class="form-control" placeholder="Masukan DO Number atau Faktur ID" required />
            </div>
            <div class="col-md-2 d-flex align-items-center">
              <button id="btnSearch" type="submit" class="btn btn-primary w-100">Cari</button>
            </div>
          </form>
        </div>
      </div>

      <!-- Loading Indicator for Search -->
      <div id="loadingSearch" class="d-none mb-3">
        <div class="d-flex align-items-center gap-2">
          <div class="spinner-border text-primary" role="status" style="width: 1.5rem; height: 1.5rem;">
            <span class="visually-hidden">Loading...</span>
          </div>
          <span class="text-muted">Mencari data...</span>
        </div>
      </div>

      <!-- Order Data Table -->
      <div class="card mb-3">
        <div class="card-header">
          <h5 class="mb-0">Data Order</h5>
        </div>
        <div class="card-body table-container">
          <div id="loadingOrderTable" class="loading-overlay d-none">
            <div class="spinner-border text-primary" role="status">
              <span class="visually-hidden">Loading...</span>
            </div>
          </div>
          <div class="table-responsive">
            <table class="table table-bordered table-striped table-hover" id="tblOrder">
              <thead class="table-dark sticky-top">
                <tr id="orderTableHeader">
                  <!-- Headers will be generated dynamically -->
                </tr>
              </thead>
              <tbody id="orderTableBody">
                <tr>
                  <td colspan="100%" class="text-center text-muted">Pilih Environment, masukan Order Number dan klik Cari untuk melihat data</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- Status Update Form -->
      <div class="card mb-3" id="statusUpdateCard" style="display: none;">
        <div class="card-header">
          <h5 class="mb-0">Ubah Status</h5>
        </div>
        <div class="card-body">
          <form id="frmUpdateStatus" class="row g-3 align-items-end">
            <div class="col-md-10">
              <label class="form-label">Status Baru <span class="text-danger">*</span></label>
              <select id="selectStatus" class="form-select" required>
                <option value="">-- Pilih Status --</option>
                <option value="new">new</option>
                <option value="loading">loading</option>
                <option value="ready_to_deliver">ready_to_deliver</option>
                <option value="in_delivery">in_delivery</option>
                <option value="completed">completed</option>
                <option value="skip">skip</option>
                <option value="rejected">rejected</option>
                <option value="hold">hold</option>
                <option value="failed">failed</option>
                <option value="return_to_wms">return_to_wms</option>
                <option value="inactive">inactive</option>
                <option value="in_optimization">in_optimization</option>
              </select>
            </div>
            <div class="col-md-2 d-flex align-items-center">
              <button id="btnSave" type="submit" class="btn btn-success w-100">Simpan</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Modal for Error Messages -->
    <div class="modal" tabindex="-1" id="modalError">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Error</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <p id="errorMessage"></p>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Tutup</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal for Confirmation -->
    <div class="modal" tabindex="-1" id="modalConfirm">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Konfirmasi</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <p id="confirmMessage"></p>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
            <button type="button" class="btn btn-primary" id="btnConfirmSave">Ya, Simpan</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal for Success -->
    <div class="modal" tabindex="-1" id="modalSuccess">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Berhasil</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <p id="successMessage"></p>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Tutup</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      const frmSearch = document.getElementById('frmSearch');
      const selectEnv = document.getElementById('selectEnv');
      const orderNumber = document.getElementById('orderNumber');
      const btnSearch = document.getElementById('btnSearch');
      const loadingSearch = document.getElementById('loadingSearch');
      const loadingOrderTable = document.getElementById('loadingOrderTable');
      const orderTableHeader = document.getElementById('orderTableHeader');
      const orderTableBody = document.getElementById('orderTableBody');
      const statusUpdateCard = document.getElementById('statusUpdateCard');
      const frmUpdateStatus = document.getElementById('frmUpdateStatus');
      const selectStatus = document.getElementById('selectStatus');
      const btnSave = document.getElementById('btnSave');
      
      const errorModal = new bootstrap.Modal(document.getElementById('modalError'));
      const errorMessage = document.getElementById('errorMessage');
      const confirmModal = new bootstrap.Modal(document.getElementById('modalConfirm'));
      const confirmMessage = document.getElementById('confirmMessage');
      const successModal = new bootstrap.Modal(document.getElementById('modalSuccess'));
      const successMessage = document.getElementById('successMessage');
      const btnConfirmSave = document.getElementById('btnConfirmSave');

      let currentOrderData = null;

      // Function to show error
      function showError(message) {
        errorMessage.textContent = message;
        errorModal.show();
      }

      // Function to show success
      function showSuccess(message) {
        successMessage.textContent = message;
        successModal.show();
      }

      // Function to render table headers dynamically
      function renderTableHeaders(container, data) {
        if (!data || Object.keys(data).length === 0) return;
        
        container.innerHTML = '';
        const headers = Object.keys(data);
        headers.forEach(header => {
          const th = document.createElement('th');
          th.textContent = header;
          th.style.whiteSpace = 'nowrap';
          container.appendChild(th);
        });
      }

      // Function to render table row
      function renderTableRow(container, data, headers) {
        container.innerHTML = '';
        
        if (!data || Object.keys(data).length === 0) {
          const tr = document.createElement('tr');
          const td = document.createElement('td');
          td.colSpan = headers.length;
          td.className = 'text-center text-muted';
          td.textContent = 'Tidak ada data';
          tr.appendChild(td);
          container.appendChild(tr);
          return;
        }

        const tr = document.createElement('tr');
        headers.forEach(header => {
          const td = document.createElement('td');
          const value = data[header];
          td.textContent = value !== null && value !== undefined ? String(value) : '';
          td.style.whiteSpace = 'nowrap';
          td.style.maxWidth = '300px';
          td.style.overflow = 'hidden';
          td.style.textOverflow = 'ellipsis';
          td.title = value !== null && value !== undefined ? String(value) : '';
          tr.appendChild(td);
        });
        container.appendChild(tr);
      }

      // Load order by order number
      async function loadOrder() {
        const env = selectEnv.value.trim();
        const orderNum = orderNumber.value.trim();
        
        if (!env) {
          showError('Environment wajib dipilih');
          return;
        }
        if (!orderNum) {
          showError('Order Number wajib diisi');
          return;
        }

        loadingSearch.classList.remove('d-none');
        btnSearch.disabled = true;
        loadingOrderTable.classList.remove('d-none');
        statusUpdateCard.style.display = 'none';
        currentOrderData = null;
        
        try {
          const res = await fetch(`/api/ubah-order-status/search?env=${encodeURIComponent(env)}&order_number=${encodeURIComponent(orderNum)}`);
          const json = await res.json();
          
          if (json.status === 200) {
            const data = json.data || {};
            
            if (Object.keys(data).length > 0) {
              // Render order table
              const headers = Object.keys(data);
              renderTableHeaders(orderTableHeader, data);
              renderTableRow(orderTableBody, data, headers);
              
              // Store current order data
              currentOrderData = data;
              
              // Show status update form
              statusUpdateCard.style.display = 'block';
              selectStatus.value = data.status || '';
            } else {
              orderTableHeader.innerHTML = '';
              orderTableBody.innerHTML = '<tr><td colspan="100%" class="text-center text-muted">Tidak ada data ditemukan</td></tr>';
            }
          } else if (json.status === 404) {
            // Show modal for not found
            showError(`Order Number ${orderNum} tidak ditemukan`);
            orderTableHeader.innerHTML = '';
            orderTableBody.innerHTML = '<tr><td colspan="100%" class="text-center text-muted">Data tidak ditemukan</td></tr>';
          } else {
            showError(json.message || 'Error saat mengambil data');
          }
        } catch (error) {
          showError('Error: ' + error.message);
        } finally {
          loadingSearch.classList.add('d-none');
          btnSearch.disabled = false;
          loadingOrderTable.classList.add('d-none');
        }
      }

      // Update order status
      async function updateStatus() {
        if (!currentOrderData) {
          showError('Tidak ada data order yang dipilih');
          return;
        }

        const env = selectEnv.value.trim();
        const newStatus = selectStatus.value.trim();
        const orderId = currentOrderData.order_id;

        if (!env) {
          showError('Environment wajib dipilih');
          return;
        }
        if (!newStatus) {
          showError('Status baru wajib dipilih');
          return;
        }
        if (!orderId) {
          showError('Order ID tidak valid');
          return;
        }

        btnSave.disabled = true;
        
        try {
          const res = await fetch('/api/ubah-order-status/update', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({
              env: env,
              order_id: orderId,
              status: newStatus
            })
          });
          
          const json = await res.json();
          
          if (json.status === 200) {
            showSuccess(json.message || 'Status berhasil diubah');
            // Reload order data to show updated status
            await loadOrder();
          } else {
            showError(json.message || 'Error saat mengubah status');
          }
        } catch (error) {
          showError('Error: ' + error.message);
        } finally {
          btnSave.disabled = false;
        }
      }

      // Event listeners
      frmSearch.addEventListener('submit', async (e) => {
        e.preventDefault();
        await loadOrder();
      });

      frmUpdateStatus.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        if (!currentOrderData) {
          showError('Tidak ada data order yang dipilih');
          return;
        }

        const env = selectEnv.value.trim();
        const newStatus = selectStatus.value.trim();
        const orderNum = orderNumber.value.trim();
        const currentStatus = currentOrderData.status || '';

        // Show confirmation modal
        confirmMessage.textContent = `Apakah Anda yakin ingin mengubah status order "${orderNum}" dari "${currentStatus}" menjadi "${newStatus}" di environment ${env.toUpperCase()}?`;
        confirmModal.show();
      });

      btnConfirmSave.addEventListener('click', async () => {
        confirmModal.hide();
        await updateStatus();
      });

      // Allow Enter key to submit search
      orderNumber.addEventListener('keypress', async (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          await loadOrder();
        }
      });
    </script>
  </body>
</html>
