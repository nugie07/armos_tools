<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error {{ error_code }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-danger text-white">
                        <h4 class="mb-0">Error {{ error_code }}</h4>
                    </div>
                    <div class="card-body">
                        <p class="text-danger">{{ error_message }}</p>
                        <hr>
                        <p class="text-muted small">
                            Jika error ini terus terjadi, silakan hubungi administrator.
                            <br>
                            Check log file <code>app.log</code> untuk detail error.
                        </p>
                        <a href="{{ url_for('index') }}" class="btn btn-primary">Kembali ke Home</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
