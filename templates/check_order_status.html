<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Check Order Status</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
    <style>
      .table-responsive {
        max-height: 600px;
        overflow-y: auto;
      }
      .loading-overlay {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(255, 255, 255, 0.8);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
      }
      .table-container {
        position: relative;
      }
    </style>
  </head>
  <body class="p-4">
    <div class="container">
      <div class="d-flex align-items-center justify-content-between mb-4">
        <h4 class="mb-0">Check Order Status</h4>
        <div class="d-flex gap-2">
          <a href="/" class="btn btn-outline-secondary" title="Home">🏠</a>
          <a href="/logout" class="btn btn-outline-danger" title="Logout">⎋</a>
        </div>
      </div>

      <!-- Search Form -->
      <div class="card mb-3">
        <div class="card-body">
          <form id="frmSearch" class="row g-3 align-items-end">
            <div class="col-md-10">
              <label class="form-label">Masukan DO Number</label>
              <input id="doNumber" type="text" class="form-control" placeholder="Contoh: G01SI2511-0237" required />
            </div>
            <div class="col-md-2 d-flex align-items-center">
              <button id="btnSearch" type="submit" class="btn btn-primary w-100">Cari</button>
            </div>
          </form>
        </div>
      </div>

      <!-- Loading Indicator for Search -->
      <div id="loadingSearch" class="d-none mb-3">
        <div class="d-flex align-items-center gap-2">
          <div class="spinner-border text-primary" role="status" style="width: 1.5rem; height: 1.5rem;">
            <span class="visually-hidden">Loading...</span>
          </div>
          <span class="text-muted">Mencari data...</span>
        </div>
      </div>

      <!-- LIST Order Table -->
      <div class="card mb-3">
        <div class="card-header">
          <h5 class="mb-0">LIST Order</h5>
        </div>
        <div class="card-body table-container">
          <div id="loadingOrderTable" class="loading-overlay d-none">
            <div class="spinner-border text-primary" role="status">
              <span class="visually-hidden">Loading...</span>
            </div>
          </div>
          <div class="table-responsive">
            <table class="table table-bordered table-striped table-hover" id="tblOrders">
              <thead class="table-dark sticky-top">
                <tr id="orderTableHeader">
                  <!-- Headers will be generated dynamically -->
                </tr>
              </thead>
              <tbody id="orderTableBody">
                <tr>
                  <td colspan="100%" class="text-center text-muted">Masukan DO Number dan klik Cari untuk melihat data</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- Detail Order Table -->
      <div class="card mb-3">
        <div class="card-header">
          <h5 class="mb-0">Detail Order</h5>
        </div>
        <div class="card-body table-container">
          <div id="loadingDetailTable" class="loading-overlay d-none">
            <div class="spinner-border text-primary" role="status">
              <span class="visually-hidden">Loading...</span>
            </div>
          </div>
          <div class="table-responsive">
            <table class="table table-bordered table-striped table-hover" id="tblOrderDetails">
              <thead class="table-dark sticky-top">
                <tr id="detailTableHeader">
                  <!-- Headers will be generated dynamically -->
                </tr>
              </thead>
              <tbody id="detailTableBody">
                <tr>
                  <td colspan="100%" class="text-center text-muted">Double klik pada data di LIST Order untuk melihat Detail Order</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal for Error Messages -->
    <div class="modal" tabindex="-1" id="modalError">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Error</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <p id="errorMessage"></p>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Tutup</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      const frmSearch = document.getElementById('frmSearch');
      const doNumber = document.getElementById('doNumber');
      const btnSearch = document.getElementById('btnSearch');
      const loadingSearch = document.getElementById('loadingSearch');
      const loadingOrderTable = document.getElementById('loadingOrderTable');
      const loadingDetailTable = document.getElementById('loadingDetailTable');
      const orderTableHeader = document.getElementById('orderTableHeader');
      const orderTableBody = document.getElementById('orderTableBody');
      const detailTableHeader = document.getElementById('detailTableHeader');
      const detailTableBody = document.getElementById('detailTableBody');
      const errorModal = new bootstrap.Modal(document.getElementById('modalError'));
      const errorMessage = document.getElementById('errorMessage');

      let currentOrderId = null;

      // Function to show error
      function showError(message) {
        errorMessage.textContent = message;
        errorModal.show();
      }

      // Function to render table headers dynamically
      function renderTableHeaders(container, data) {
        if (!data || data.length === 0) return;
        
        container.innerHTML = '';
        const headers = Object.keys(data[0]);
        headers.forEach(header => {
          const th = document.createElement('th');
          th.textContent = header;
          th.style.whiteSpace = 'nowrap';
          container.appendChild(th);
        });
      }

      // Function to render table rows
      function renderTableRows(container, data, headers) {
        container.innerHTML = '';
        
        if (!data || data.length === 0) {
          const tr = document.createElement('tr');
          const td = document.createElement('td');
          td.colSpan = headers.length;
          td.className = 'text-center text-muted';
          td.textContent = 'Tidak ada data';
          tr.appendChild(td);
          container.appendChild(tr);
          return;
        }

        data.forEach(row => {
          const tr = document.createElement('tr');
          tr.style.cursor = 'pointer';
          headers.forEach(header => {
            const td = document.createElement('td');
            const value = row[header];
            td.textContent = value !== null && value !== undefined ? String(value) : '';
            td.style.whiteSpace = 'nowrap';
            td.style.maxWidth = '300px';
            td.style.overflow = 'hidden';
            td.style.textOverflow = 'ellipsis';
            td.title = value !== null && value !== undefined ? String(value) : '';
            tr.appendChild(td);
          });
          container.appendChild(tr);
        });
      }

      // Load orders by faktur_id
      async function loadOrders() {
        const fakturId = doNumber.value.trim();
        if (!fakturId) {
          showError('DO Number wajib diisi');
          return;
        }

        loadingSearch.classList.remove('d-none');
        btnSearch.disabled = true;
        loadingOrderTable.classList.remove('d-none');
        
        try {
          const res = await fetch(`/api/check-order-status/orders?faktur_id=${encodeURIComponent(fakturId)}`);
          const json = await res.json();
          
          if (json.status === 200) {
            const data = json.data || [];
            
            if (data.length > 0) {
              // Render order table
              const headers = Object.keys(data[0]);
              renderTableHeaders(orderTableHeader, data);
              renderTableRows(orderTableBody, data, headers);
              
              // Add double click event to order rows
              orderTableBody.querySelectorAll('tr').forEach((tr, index) => {
                tr.addEventListener('dblclick', () => {
                  const orderId = data[index].order_id;
                  if (orderId) {
                    currentOrderId = orderId;
                    loadOrderDetails(orderId);
                  }
                });
              });
            } else {
              orderTableHeader.innerHTML = '';
              orderTableBody.innerHTML = '<tr><td colspan="100%" class="text-center text-muted">Tidak ada data ditemukan</td></tr>';
            }
            
            // Clear detail table
            detailTableHeader.innerHTML = '';
            detailTableBody.innerHTML = '<tr><td colspan="100%" class="text-center text-muted">Double klik pada data di LIST Order untuk melihat Detail Order</td></tr>';
            currentOrderId = null;
          } else {
            showError(json.message || 'Error saat mengambil data');
          }
        } catch (error) {
          showError('Error: ' + error.message);
        } finally {
          loadingSearch.classList.add('d-none');
          btnSearch.disabled = false;
          loadingOrderTable.classList.add('d-none');
        }
      }

      // Load order details by order_id
      async function loadOrderDetails(orderId) {
        if (!orderId) return;

        loadingDetailTable.classList.remove('d-none');
        
        try {
          const res = await fetch(`/api/check-order-status/order-details?order_id=${orderId}`);
          const json = await res.json();
          
          if (json.status === 200) {
            const data = json.data || [];
            
            if (data.length > 0) {
              // Render detail table
              const headers = Object.keys(data[0]);
              renderTableHeaders(detailTableHeader, data);
              renderTableRows(detailTableBody, data, headers);
            } else {
              detailTableHeader.innerHTML = '';
              detailTableBody.innerHTML = '<tr><td colspan="100%" class="text-center text-muted">Tidak ada detail order ditemukan</td></tr>';
            }
          } else {
            showError(json.message || 'Error saat mengambil detail order');
          }
        } catch (error) {
          showError('Error: ' + error.message);
        } finally {
          loadingDetailTable.classList.add('d-none');
        }
      }

      // Event listeners
      frmSearch.addEventListener('submit', async (e) => {
        e.preventDefault();
        await loadOrders();
      });

      // Allow Enter key to submit
      doNumber.addEventListener('keypress', async (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          await loadOrders();
        }
      });
    </script>
  </body>
</html>
