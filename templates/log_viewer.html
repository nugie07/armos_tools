<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Log Viewer</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
    <style>
      .monospace { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: 12px; }
      textarea.monospace { height: 200px; }
    </style>
  </head>
  <body class="p-4">
    <div class="container">
      <div class="d-flex align-items-center justify-content-between mb-4">
        <h4 class="mb-0">Log Viewer</h4>
        <div class="d-flex gap-2">
          <a href="/" class="btn btn-outline-secondary" title="Home">🏠</a>
          <a href="/logout" class="btn btn-outline-danger" title="Logout">⎋</a>
        </div>
      </div>

      <div class="row g-3 mb-3">
        <div class="col-md-4">
          <label class="form-label">Pilih File JSON</label>
          <select id="ddlFile" class="form-select"></select>
        </div>
        <div class="col-md-4">
          <label class="form-label">Cari Event</label>
          <select id="ddlEvent" class="form-select">
            <option value="">-- Pilih Event --</option>
            <option value="[ARMOS -> WMS] Syncing Inventory">[ARMOS -> WMS] Syncing Inventory</option>
            <option value="[ARMOS -> WMS] Synchronizing Order Manifest">[ARMOS -> WMS] Synchronizing Order Manifest</option>
            <option value="[ARMOS -> WMS] Synchronizing Route Manifest Generation">[ARMOS -> WMS] Synchronizing Route Manifest Generation</option>
            <option value="[ARMOS -> SQL] Patch Order Status">[ARMOS -> SQL] Patch Order Status</option>
            <option value="[ARMOS -> ATENA] Patch Order Status">[ARMOS -> ATENA] Patch Order Status</option>
            <option value="[ARMOS -> SQL] Picklist Route">[ARMOS -> SQL] Picklist Route</option>
            <option value="[FEED ORDER V2 SQL -> TMS]">[FEED ORDER V2 SQL -> TMS]</option>
            <option value="[FEED ORDER V2 ATENA -> TMS]">[FEED ORDER V2 ATENA -> TMS]</option>
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label" id="lblRequest">Cari Request</label>
          <input id="searchRequest" type="text" class="form-control" placeholder="Masukan Request" />
        </div>
      </div>

      <div class="mb-3 d-flex align-items-center gap-2">
        <button id="btnSearch" class="btn btn-primary">Search</button>
        <div id="loading" class="spinner-border text-primary d-none" role="status" style="width: 1.5rem; height: 1.5rem;"><span class="visually-hidden">Loading...</span></div>
      </div>
      <div class="mb-3">
        <small class="text-muted">Double Klik dalam Data dibawah untuk melihat details</small>
      </div>

      <div class="table-responsive mb-4">
        <table class="table table-bordered table-striped" id="tblLogs">
          <thead>
            <tr>
              <th>api_request_log_id</th>
              <th>event</th>
              <th>created_date</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

      <div class="d-flex align-items-center gap-2 mb-4">
        <button id="prevPage" class="btn btn-outline-secondary btn-sm">Prev</button>
        <span id="pageInfo" class="small text-muted">Page 1/1</span>
        <button id="nextPage" class="btn btn-outline-secondary btn-sm">Next</button>
      </div>

      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Nama Event</label>
          <input id="detailEvent" type="text" class="form-control monospace" readonly />
        </div>
        <div class="col-md-6">
          <label class="form-label">Created Date</label>
          <input id="detailCreated" type="text" class="form-control monospace" readonly />
        </div>
        <div class="col-12">
          <label class="form-label">Request</label>
          <textarea id="detailRequest" class="form-control monospace" readonly></textarea>
        </div>
        <div class="col-12">
          <label class="form-label">Response</label>
          <textarea id="detailResponse" class="form-control monospace" readonly></textarea>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      const ddlFile = document.getElementById('ddlFile');
      const ddlEvent = document.getElementById('ddlEvent');
      const searchRequest = document.getElementById('searchRequest');
      const lblRequest = document.getElementById('lblRequest');
      const btnSearch = document.getElementById('btnSearch');
      const loading = document.getElementById('loading');
      const tblBody = document.querySelector('#tblLogs tbody');

      const detailEvent = document.getElementById('detailEvent');
      const detailCreated = document.getElementById('detailCreated');
      const detailRequest = document.getElementById('detailRequest');
      const detailResponse = document.getElementById('detailResponse');

      let currentData = [];
      let selectedRecordId = null;
      let currentPage = 1;
      let totalPages = 1;
      let searchField = null; // Field yang akan dicari di request JSON (do_reference, manifest_reference, dll)

      // Mapping event ke konfigurasi search field
      const eventConfig = {
        '[ARMOS -> WMS] Syncing Inventory': {
          disabled: true,
          label: 'Cari Request',
          placeholder: 'Masukan Request'
        },
        '[ARMOS -> WMS] Synchronizing Order Manifest': {
          disabled: false,
          label: 'Masukan Do Reference',
          placeholder: 'contoh do_reference":"B03SI2505-0558"',
          searchField: 'do_reference'
        },
        '[ARMOS -> WMS] Synchronizing Route Manifest Generation': {
          disabled: false,
          label: 'Masukan Manifest Reference',
          placeholder: 'contoh Manifest Reference":"RMSDA0120250508#34"',
          searchField: 'manifest_reference'
        },
        '[ARMOS -> SQL] Patch Order Status': {
          disabled: false,
          label: 'Masukan FakturReference',
          placeholder: 'contoh Faktur Reference":"M30SI2505-0009"',
          searchField: 'faktur_reference'
        },
        '[ARMOS -> ATENA] Patch Order Status': {
          disabled: false,
          label: 'Masukan Route Id',
          placeholder: 'contoh Route Id:"RMSDA0120250919#66"',
          searchField: 'route_id'
        },
        '[ARMOS -> SQL] Picklist Route': {
          disabled: false,
          label: 'Masukan Route Id',
          placeholder: 'contoh Route Id:"RMSDA0120250919#66"',
          searchField: 'route_id'
        },
        '[FEED ORDER V2 SQL -> TMS]': {
          disabled: false,
          label: 'Masukan outbound reference',
          placeholder: 'contoh Outbound Reference "C10SI2509-0041"',
          searchField: 'outbound_reference'
        },
        '[FEED ORDER V2 ATENA -> TMS]': {
          disabled: false,
          label: 'Masukan outbound reference',
          placeholder: 'contoh Outbound Reference "C10SI2509-0041"',
          searchField: 'outbound_reference'
        }
      };

      // Update UI berdasarkan event yang dipilih
      function updateRequestField() {
        const selectedEvent = ddlEvent.value;
        const config = eventConfig[selectedEvent];
        
        if (config) {
          searchRequest.disabled = config.disabled;
          lblRequest.textContent = config.label;
          searchRequest.placeholder = config.placeholder;
          searchField = config.searchField || null;
          
          if (config.disabled) {
            searchRequest.value = '';
          }
        } else {
          searchRequest.disabled = false;
          lblRequest.textContent = 'Cari Request';
          searchRequest.placeholder = 'Masukan Request';
          searchField = null;
        }
      }

      function renderFileOptions(files){
        ddlFile.innerHTML = '';
        files.forEach(f => {
          const opt = document.createElement('option');
          opt.value = f;
          opt.textContent = f;
          ddlFile.appendChild(opt);
        });
      }

      async function loadFiles(){
        const res = await fetch('/api/log/files');
        const json = await res.json();
        renderFileOptions(json.data || []);
      }

      function fillDetails(r){
        if(!r) return;
        detailEvent.value = r.event ?? '';
        detailCreated.value = r.created_date ?? '';
        let reqText = r.request ?? '';
        try { if (typeof reqText === 'string') { const o = JSON.parse(reqText); reqText = JSON.stringify(o, null, 2); } } catch(e) {}
        detailRequest.value = reqText;
        let respText = r.response ?? '';
        try { if (typeof respText === 'string') { const o = JSON.parse(respText); respText = JSON.stringify(o, null, 2); } } catch(e) {}
        detailResponse.value = respText;
      }

      function renderRows(rows){
        tblBody.innerHTML = '';
        rows.forEach(r => {
          const tr = document.createElement('tr');
          tr.dataset.idx = r._idx;
          tr.innerHTML = `<td>${r.api_request_log_id ?? ''}</td><td>${r.event ?? ''}</td><td>${r.created_date ?? ''}</td>`;
          tr.addEventListener('dblclick', () => {
            selectedRecordId = r.api_request_log_id ?? null;
            fillDetails(r);
          });
          tblBody.appendChild(tr);
        });
      }

      async function doSearch(){
        const file = ddlFile.value;
        if(!file){ alert('Pilih file JSON terlebih dahulu'); return; }
        if(!ddlEvent.value){ alert('Pilih Event terlebih dahulu'); return; }
        
        const qEvent = ddlEvent.value.trim();
        const qReq = searchRequest.value.trim();
        
        // Validasi: jika field tidak disabled, harus diisi
        if (!searchRequest.disabled && !qReq) {
          alert('Isi ' + lblRequest.textContent + ' terlebih dahulu');
          return;
        }
        
        const prevSelected = selectedRecordId;
        loading.classList.remove('d-none');
        try {
          const res = await fetch(`/api/log/search?file=${encodeURIComponent(file)}&event=${encodeURIComponent(qEvent)}&request=${encodeURIComponent(qReq)}&search_field=${encodeURIComponent(searchField || '')}&page=${currentPage}&per_page=10`);
          const json = await res.json();
          
          if (json.status === 200) {
            currentData = (json.data || []).map((x, i) => ({...x, _idx: i}));
            totalPages = json.pages || 1;
            const info = document.getElementById('pageInfo');
            if(info){ info.textContent = `Page ${json.page || 1}/${totalPages}`; }
            renderRows(currentData);
            
            // Show popup jika data tidak ditemukan
            if (currentData.length === 0) {
              alert('Data Tidak ada');
            }
            
            if(prevSelected != null){
              const found = currentData.find(r => String(r.api_request_log_id) === String(prevSelected));
              if(found){ fillDetails(found); }
            }
          } else {
            alert(json.message || 'Error saat melakukan pencarian');
          }
        } catch (error) {
          alert('Error: ' + error.message);
        } finally {
          loading.classList.add('d-none');
        }
      }

      // Event listeners
      ddlEvent.addEventListener('change', updateRequestField);
      btnSearch.addEventListener('click', doSearch);
      document.getElementById('prevPage').addEventListener('click', () => { if(currentPage > 1){ currentPage--; doSearch(); } });
      document.getElementById('nextPage').addEventListener('click', () => { if(currentPage < totalPages){ currentPage++; doSearch(); } });
      
      // Initialize
      loadFiles();
      updateRequestField(); // Set initial state
    </script>
  </body>
</html>
