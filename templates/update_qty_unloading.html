<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Update Quantity Delivery / Unloading</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
  </head>
  <body class="p-4">
    <div class="container">
      <div class="d-flex align-items-center justify-content-between mb-4">
        <h4 class="mb-0">Update Quantity Delivery / Unloading</h4>
        <div class="d-flex gap-2">
          <a href="/" class="btn btn-outline-secondary">🏠</a>
          <a href="/logout" class="btn btn-outline-danger">⎋</a>
        </div>
      </div>

      <div class="card mb-3">
        <div class="card-body">
          <form id="frmFind" class="row g-3 align-items-end">
            <div class="col-md-4">
              <label class="form-label">Warehouse</label>
              <select id="warehouse" class="form-select" required>
                <option value="">-- Pilih Warehouse --</option>
                {% for wid, wname in warehouses %}
                <option value="{{ wid }}">{{ wid }} - {{ wname }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label">Nomor Faktur</label>
              <input id="faktur" type="text" class="form-control" placeholder="Contoh: G03SI2510-0036" required />
            </div>
            <div class="col-md-3">
              <label class="form-label">SKU</label>
              <input id="sku" type="text" class="form-control" placeholder="Contoh: 01010107110002" required />
            </div>
            <div class="col-md-1 d-flex align-items-center">
              <button id="btnCari" type="submit" class="btn btn-primary w-100">Cari</button>
            </div>
          </form>
        </div>
      </div>

      <div id="resultCard" class="card d-none">
        <div class="card-body">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Detail ID</label>
              <input id="detailId" type="text" class="form-control" readonly />
            </div>
            <div class="col-md-6">
              <label class="form-label">SKU ITEM</label>
              <input id="skuItem" type="text" class="form-control" readonly />
            </div>
            <div class="col-md-6">
              <label class="form-label">Faktur Quantity</label>
              <input id="qtyFaktur" type="number" step="0.01" class="form-control" readonly />
            </div>
            <div class="col-md-6">
              <label class="form-label">Jumlah Item yang Dikirim</label>
              <input id="qtyUnloading" type="number" step="0.01" class="form-control" />
            </div>
          </div>
          <div class="mt-3 text-end">
            <button id="btnSave" class="btn btn-success">Simpan</button>
          </div>
        </div>
      </div>
    </div>

    <div class="modal" tabindex="-1" id="modalInfo">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header"><h5 class="modal-title">Informasi</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
          <div class="modal-body"><pre id="modalMessage" class="mb-0" style="white-space: pre-wrap"></pre></div>
          <div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Tutup</button></div>
        </div>
      </div>
    </div>

    <div class="modal" tabindex="-1" id="modalConfirm">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header"><h5 class="modal-title">Konfirmasi</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
          <div class="modal-body"><div id="confirmMessage" class="mb-0"></div></div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Tidak</button>
            <button type="button" class="btn btn-primary" id="btnConfirm">Ya, Simpan</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      const frmFind = document.getElementById('frmFind');
      const warehouse = document.getElementById('warehouse');
      const faktur = document.getElementById('faktur');
      const sku = document.getElementById('sku');
      const resultCard = document.getElementById('resultCard');
      const detailId = document.getElementById('detailId');
      const skuItem = document.getElementById('skuItem');
      const qtyFaktur = document.getElementById('qtyFaktur');
      const qtyUnloading = document.getElementById('qtyUnloading');
      const btnSave = document.getElementById('btnSave');
      const modal = new bootstrap.Modal(document.getElementById('modalInfo'));
      const modalMessage = document.getElementById('modalMessage');
      const confirmModal = new bootstrap.Modal(document.getElementById('modalConfirm'));
      const confirmMessage = document.getElementById('confirmMessage');
      const btnConfirm = document.getElementById('btnConfirm');
      let pendingUpdate = null;

      frmFind.addEventListener('submit', async (e) => {
        e.preventDefault();
        const wid = warehouse.value.trim();
        const f = faktur.value.trim();
        const s = sku.value.trim();
        if(!wid || !f || !s){
          modalMessage.textContent = 'Warehouse, Faktur, SKU wajib diisi'; modal.show(); return;
        }
        const res = await fetch(`/api/qty-unloading/find?warehouse_id=${encodeURIComponent(wid)}&faktur_id=${encodeURIComponent(f)}&sku=${encodeURIComponent(s)}`);
        const ct = res.headers.get('content-type') || '';
        if(!ct.includes('application/json')){ modalMessage.textContent = 'Respon bukan JSON'; modal.show(); return; }
        const json = await res.json();
        if(json.status !== 200){ modalMessage.textContent = json.message || 'Data tidak ditemukan'; modal.show(); resultCard.classList.add('d-none'); return; }
        const d = json.data;
        detailId.value = d.order_detail_id;
        skuItem.value = d.sku;
        qtyFaktur.value = d.quantity_faktur ?? 0;
        qtyUnloading.value = d.quantity_unloading ?? 0;
        resultCard.classList.remove('d-none');
      });

      btnSave.addEventListener('click', () => {
        const id = parseInt(detailId.value, 10);
        const q = parseFloat(qtyUnloading.value);
        if(!id || isNaN(q)){
          modalMessage.textContent = 'Nilai tidak valid'; modal.show(); return;
        }
        pendingUpdate = { id, q };
        confirmMessage.textContent = `Simpan perubahan jumlah kirim (quantity_unloading) menjadi ${q} untuk Detail ID ${id}?`;
        confirmModal.show();
      });

      btnConfirm.addEventListener('click', async () => {
        if(!pendingUpdate){ return; }
        const { id, q } = pendingUpdate;
        btnConfirm.disabled = true;
        try {
          const res = await fetch('/api/qty-unloading/update', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ order_detail_id: id, quantity_unloading: q }) });
          const ct = res.headers.get('content-type') || '';
          confirmModal.hide();
          if(!ct.includes('application/json')){ modalMessage.textContent = 'Respon bukan JSON'; modal.show(); return; }
          const json = await res.json();
          if(json.status === 200){ modalMessage.textContent = 'Berhasil disimpan'; }
          else { modalMessage.textContent = 'Gagal menyimpan'; }
          modal.show();
        } catch (err){
          confirmModal.hide();
          modalMessage.textContent = 'Terjadi error saat menyimpan: ' + (err && err.message ? err.message : String(err));
          modal.show();
        } finally {
          btnConfirm.disabled = false;
          pendingUpdate = null;
        }
      });
    </script>
  </body>
  </html>
